<!doctype html>
<html lang="es-MX" style="background: #f7ebe4">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preload" href="/fonts/Rubik-VF.ttf" as="font" type="font/ttf" crossorigin />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#9d2449" />
		<script>
			try {
				var root = document.documentElement;
				root.dataset.js = 'yes';
				if (sessionStorage.getItem('ruta-libre:consent') === 'yes') root.dataset.consent = 'yes';
				if (sessionStorage.getItem('ruta-libre:banner-dismissed') === 'yes')
					root.dataset.bannerDismissed = 'yes';
			} catch (error) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
